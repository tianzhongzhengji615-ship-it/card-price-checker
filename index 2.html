<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b5ed7'><title>カード相場チェッカー</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f7fb;color:#152238}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding-bottom:90px}.hero{padding:32px 22px 25px;background:linear-gradient(135deg,#0758c9,#1687ef);color:#fff;border-radius:0 0 28px 28px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;opacity:.9;font-size:14px}.content{padding:22px}.tabs{display:flex;background:#eef3f8;border-radius:14px;padding:4px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:11px;font-weight:700;color:#607086}.tab.active{background:white;color:#0b66d8;box-shadow:0 2px 8px #ccd6e2}.search{display:flex;border:1px solid #d7e0ea;border-radius:15px;overflow:hidden;background:#fff}.search input{border:0;outline:0;padding:15px;flex:1;font-size:16px;min-width:0}.search button{border:0;background:#0b6ee0;color:white;width:58px;font-size:20px}.camera{margin-top:16px;width:100%;border:0;border-radius:18px;background:#eaf4ff;padding:22px 16px;color:#064d9d;font-weight:800;font-size:18px}.camera small{display:block;font-size:12px;font-weight:500;margin-top:5px}.preview{display:none;margin-top:18px}.preview img{width:100%;max-height:360px;object-fit:contain;border-radius:18px;background:#101820}.actions{display:flex;gap:10px;margin-top:12px}.btn{flex:1;border:0;border-radius:13px;padding:13px;font-weight:800}.primary{background:#0b6ee0;color:white}.secondary{background:#eef2f6;color:#34495e}.section{margin-top:25px}.section h2{font-size:17px;margin:0 0 12px}.card{border:1px solid #e0e7ef;border-radius:17px;padding:16px;background:#fff;box-shadow:0 5px 20px rgba(20,40,70,.05)}.muted{color:#738195;font-size:13px}.result{display:none}.price{font-size:26px;font-weight:900;color:#e53935;margin:9px 0}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{text-decoration:none;background:#f1f5f9;color:#1559a5;padding:9px 11px;border-radius:10px;font-size:13px;font-weight:700}.note{margin-top:18px;padding:13px;border-radius:13px;background:#fff8e5;color:#745800;font-size:12px;line-height:1.6}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:white;border-top:1px solid #e4e9ef;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.bottom div{flex:1;text-align:center;font-size:11px;color:#65758b}.bottom b{display:block;font-size:20px;margin-bottom:2px}.bottom .on{color:#0b6ee0}#file{display:none}</style></head><body><main class='app'><header class='hero'><h1>カード相場チェッカー</h1><p>名前でも、カメラでも。カードのおおよその相場をかんたん確認。</p></header><div class='content'><div class='tabs'><button class='tab active' data-game='ポケモンカード'>ポケモンカード</button><button class='tab' data-game='デュエル・マスターズ'>デュエル・マスターズ</button></div><div class='search'><input id='q' placeholder='カード名を入力（例：ピカチュウ）'><button onclick='searchCard()'>⌕</button></div><input id='file' type='file' accept='image/*' capture='environment'><button class='camera' onclick="document.getElementById('file').click()">📷 カメラでカードを調べる<small>カードをその場で撮影して判定へ</small></button><div class='preview' id='preview'><img id='photo'><div class='actions'><button class='btn secondary' onclick="document.getElementById('file').click()">撮り直す</button><button class='btn primary' onclick='demoAnalyze()'>このカードを判定</button></div></div><section class='section'><h2>検索・判定結果</h2><div class='card result' id='result'><div class='muted' id='gameLabel'>ポケモンカード</div><h3 id='name' style='margin:5px 0'>カードを判定中</h3><div class='muted' id='detail'>カード番号・収録弾・イラスト違いを照合</div><div class='price' id='price'>相場を検索</div><div class='links'><a id='yahoo' target='_blank'>Yahoo!で確認</a><a id='google' target='_blank'>Googleで確認</a></div></div><div class='note'>※ この試作版ではカメラ撮影まで実際に動きます。カード画像からカード名・型番を自動認識して相場を集計する機能は、次の段階で画像認識/APIを接続します。表示価格は将来的にも鑑定価格ではなく、ネット上の販売・取引情報をもとにした目安とします。</div></section></div></main><nav class='bottom'><div class='on'><b>⌂</b>ホーム</div><div><b>⌕</b>検索</div><div><b>☆</b>お気に入り</div><div><b>▣</b>コレクション</div></nav><script>let game='ポケモンカード';document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');game=t.dataset.game});document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;document.getElementById('photo').src=URL.createObjectURL(f);document.getElementById('preview').style.display='block'});function show(n){document.getElementById('result').style.display='block';document.getElementById('gameLabel').textContent=game;document.getElementById('name').textContent=n||'撮影したカード';document.getElementById('detail').textContent='同名カードはカード番号・収録弾・イラスト違いで区別します';document.getElementById('price').textContent='ネット相場を確認';let query=encodeURIComponent(game+' '+(n||'カード')+' 相場');document.getElementById('yahoo').href='https://search.yahoo.co.jp/search?p='+query;document.getElementById('google').href='https://www.google.com/search?q='+query;document.getElementById('result').scrollIntoView({behavior:'smooth'})}function searchCard(){show(document.getElementById('q').value.trim()||'カード名を入力してください')}function demoAnalyze(){show('撮影したカード（自動認識は次の段階）')}</script></body></html>
