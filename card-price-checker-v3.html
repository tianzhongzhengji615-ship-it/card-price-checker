<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b5ed7'><title>カード相場チェッカー</title><script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f7fb;color:#152238}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding-bottom:90px}.hero{padding:32px 22px 25px;background:linear-gradient(135deg,#0758c9,#1687ef);color:#fff;border-radius:0 0 28px 28px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;opacity:.9;font-size:14px}.content{padding:22px}.tabs{display:flex;background:#eef3f8;border-radius:14px;padding:4px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;padding:11px 6px;border-radius:11px;font-weight:700;color:#607086}.tab.active{background:white;color:#0b66d8;box-shadow:0 2px 8px #ccd6e2}.search{display:flex;border:1px solid #d7e0ea;border-radius:15px;overflow:hidden;background:#fff}.search input{border:0;outline:0;padding:15px;flex:1;font-size:16px;min-width:0}.search button{border:0;background:#0b6ee0;color:white;width:58px;font-size:20px}.camera{margin-top:16px;width:100%;border:0;border-radius:18px;background:#eaf4ff;padding:22px 16px;color:#064d9d;font-weight:800;font-size:18px}.camera small{display:block;font-size:12px;font-weight:500;margin-top:5px}.preview{display:none;margin-top:18px}.preview img{width:100%;max-height:360px;object-fit:contain;border-radius:18px;background:#101820}.actions{display:flex;gap:10px;margin-top:12px}.btn{flex:1;border:0;border-radius:13px;padding:13px;font-weight:800}.primary{background:#0b6ee0;color:white}.secondary{background:#eef2f6;color:#34495e}.section{margin-top:25px}.section h2{font-size:17px;margin:0 0 12px}.card{border:1px solid #e0e7ef;border-radius:17px;padding:16px;background:#fff;box-shadow:0 5px 20px rgba(20,40,70,.05)}.muted{color:#738195;font-size:13px}.result{display:none}.price{font-size:26px;font-weight:900;color:#e53935;margin:9px 0}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{text-decoration:none;background:#f1f5f9;color:#1559a5;padding:9px 11px;border-radius:10px;font-size:13px;font-weight:700}.ocrbox{display:none;margin-top:12px;padding:13px;border-radius:13px;background:#eef7ff;color:#164f86;font-size:13px;line-height:1.6}.progress{height:7px;background:#dce8f4;border-radius:20px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#0b6ee0;transition:width .2s}.note{margin-top:18px;padding:13px;border-radius:13px;background:#fff8e5;color:#745800;font-size:12px;line-height:1.6}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:white;border-top:1px solid #e4e9ef;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.bottom div{flex:1;text-align:center;font-size:11px;color:#65758b}.bottom b{display:block;font-size:20px;margin-bottom:2px}.bottom .on{color:#0b6ee0}#file{display:none}</style></head><body><main class='app'><header class='hero'><h1>カード相場チェッカー</h1><p>名前でも、カメラでも。カードのおおよその相場をかんたん確認。</p></header><div class='content'><div class='tabs'><button class='tab active' data-game='ポケモンカード'>ポケモンカード</button><button class='tab' data-game='デュエル・マスターズ'>デュエル・マスターズ</button></div><div class='search'><input id='q' placeholder='カード名を入力（例：ピカチュウ）'><button onclick='searchCard()'>⌕</button></div><input id='file' type='file' accept='image/*' capture='environment'><button class='camera' onclick="document.getElementById('file').click()">📷 カメラでカードを調べる<small>カードをその場で撮影して判定へ</small></button><div class='preview' id='preview'><img id='photo'><div class='actions'><button class='btn secondary' onclick="document.getElementById('file').click()">撮り直す</button><button class='btn primary' id='analyzeBtn' onclick='analyzeCard()'>カード候補を絞り込む</button></div><div class='ocrbox' id='ocrbox'><b id='ocrstatus'>カードを読み取っています…</b><div class='progress'><i id='bar'></i></div><div id='ocrtext' style='margin-top:8px'></div>
<div id='assist' style='display:none;margin-top:12px'>
  <div style='font-weight:700;margin-bottom:7px'>読み取りが違うときは名前だけ直してください</div>
  <div style='display:flex;gap:7px'>
    <input id='fixName' placeholder='例：アチャモ' style='min-width:0;flex:1;border:1px solid #cfd9e6;border-radius:12px;padding:12px;font-size:16px'>
    <button class='btn primary' style='flex:0 0 auto' onclick='useFixedName()'>候補検索</button>
  </div>
</div></div></div><section class='section'><h2>検索・判定結果</h2><div class='card result' id='result'><div class='muted' id='gameLabel'>ポケモンカード</div><h3 id='name' style='margin:5px 0'>カードを判定中</h3><div class='muted' id='detail'>カード番号・収録弾・イラスト違いを照合</div><div class='price' id='price'>相場を検索</div><div class='links'><a id='yahoo' target='_blank'>Yahoo!で確認</a><a id='google' target='_blank'>Googleで確認</a></div></div><div class='note'>※ この版は、名前・レアリティ・右下の収録情報を別々に読み取り、画像検索の候補を絞ります。カード名を誤読した場合は名前だけ手動修正できます。最後は撮影画像のイラストと右下マークが同じカードか確認してください。API料金はかかりません。</div></section></div></main><nav class='bottom'><div class='on'><b>⌂</b>ホーム</div><div><b>⌕</b>検索</div><div><b>☆</b>お気に入り</div><div><b>▣</b>コレクション</div></nav><script>
let game='ポケモンカード', currentFile=null;
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');game=t.dataset.game});
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;currentFile=f;document.getElementById('photo').src=URL.createObjectURL(f);document.getElementById('preview').style.display='block';document.getElementById('ocrbox').style.display='none'});
function show(n, raw=''){document.getElementById('result').style.display='block';document.getElementById('gameLabel').textContent=game;document.getElementById('name').textContent=n||'撮影したカード';document.getElementById('detail').textContent=raw?'読み取り結果から候補を作成しました。検索結果でイラスト・カード番号を確認してください。':'同名カードはカード番号・収録弾・イラスト違いで区別します';document.getElementById('price').textContent='ネット相場を確認';let query=encodeURIComponent(game+' '+(n||'カード')+' 相場');document.getElementById('yahoo').href='https://search.yahoo.co.jp/search?p='+query;document.getElementById('google').href='https://www.google.com/search?q='+query;document.getElementById('result').scrollIntoView({behavior:'smooth'})}
function searchCard(){show(document.getElementById('q').value.trim()||'カード名を入力してください')}
function lines(t){return t.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scoreName(s){
 let score=0;
 if(/[ァ-ヶぁ-ん一-龠]/.test(s))score+=5;
 if(/^[ァ-ヶー]{2,12}$/.test(s))score+=8;
 if(s.length>=2&&s.length<=12)score+=3;
 if(/HP|たね|進化|弱点|抵抗|にげる|TRAINER|ENERGY|Illus|©/i.test(s))score-=20;
 if(/[0-9]{2,}/.test(s))score-=8;
 if(/[=:;<>%]/.test(s))score-=6;
 return score
}
function pickName(t){
 let a=lines(t).map(s=>({s,score:scoreName(s)})).sort((a,b)=>b.score-a.score);
 return a.length&&a[0].score>=7?a[0].s:'要確認'
}
function pickRarity(t){
 let x=t.toUpperCase().replace(/\s/g,'');
 let m=x.match(/SAR|SR|UR|HR|AR|CHR|CSR|RRR|RR/);
 if(m)return m[0];
 m=x.match(/(?:^|[^A-Z])(R|U|C)(?:[^A-Z]|$)/);
 return m?m[1]:'要確認'
}
function pickSetInfo(t){
 let a=lines(t).join(' ');
 let nums=a.match(/\d{1,3}\s*\/\s*\d{1,3}/g)||[];
 let codes=a.match(/[A-Z]{0,3}\d{1,3}[A-Z]?/gi)||[];
 return (nums[0]||codes.slice(-2).join(' ')||'要確認').trim()
}
async function crop(f,x,y,w,h,scale=2){
 let im=await createImageBitmap(f),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(im.width*w*scale));c.height=Math.max(1,Math.round(im.height*h*scale));
 let g=c.getContext('2d');g.imageSmoothingEnabled=true;
 g.drawImage(im,im.width*x,im.height*y,im.width*w,im.height*h,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.98))
}
async function read(b,psm=6){
 let r=await Tesseract.recognize(b,'jpn+eng',{tessedit_pageseg_mode:psm});
 return (r.data.text||'').trim()
}
function candidateQuery(name,rarity,setinfo){
 return [game,name,rarity!=='要確認'?rarity:'',setinfo!=='要確認'?setinfo:''].filter(Boolean).join(' ')
}
function showCandidate(name,rarity,setinfo,raw){
 let q=candidateQuery(name,rarity,setinfo);
 show(q,raw);
 document.getElementById('name').textContent=name==='要確認'?'カード名を確認してください':name;
 document.getElementById('detail').textContent='候補条件：レアリティ '+rarity+' ／ 収録情報 '+setinfo+'。検索先で撮影画像のイラストと右下マークが同じカードを選んでください。';
 let query=encodeURIComponent(q+' カード');
 document.getElementById('yahoo').href='https://search.yahoo.co.jp/image/search?p='+query;
 document.getElementById('yahoo').textContent='Yahoo!画像で照合';
 document.getElementById('google').href='https://www.google.com/search?tbm=isch&q='+query;
 document.getElementById('google').textContent='Google画像で照合';
 document.getElementById('price').textContent='画像候補から同じカードを確認';
}
function useFixedName(){
 let name=document.getElementById('fixName').value.trim();
 if(!name){alert('カード名を入力してください');return}
 let rarity=document.getElementById('assist').dataset.rarity||'要確認';
 let setinfo=document.getElementById('assist').dataset.setinfo||'要確認';
 showCandidate(name,rarity,setinfo,'手動でカード名を補正');
}
async function analyzeCard(){
 if(!currentFile){alert('先にカードを撮影してください');return}
 let box=document.getElementById('ocrbox'),st=document.getElementById('ocrstatus'),bar=document.getElementById('bar'),tx=document.getElementById('ocrtext'),btn=document.getElementById('analyzeBtn'),assist=document.getElementById('assist');
 box.style.display='block';assist.style.display='none';btn.disabled=true;btn.textContent='判定中…';
 try{
  st.textContent='① カード名の位置を確認中…';bar.style.width='10%';
  let nameTexts=[];
  nameTexts.push(await read(await crop(currentFile,.03,.015,.76,.15,3),7));
  bar.style.width='28%';
  nameTexts.push(await read(await crop(currentFile,.02,.00,.94,.23,2.5),6));
  let name=pickName(nameTexts.join('\n'));

  st.textContent='② レアリティを確認中…';bar.style.width='45%';
  let rarityText=await read(await crop(currentFile,.00,.70,.55,.29,3),6);
  let rarity=pickRarity(rarityText);

  st.textContent='③ 右下の収録情報を確認中…';bar.style.width='65%';
  let setText=await read(await crop(currentFile,.52,.70,.47,.29,3),6);
  let setinfo=pickSetInfo(setText);

  st.textContent='④ 候補検索を準備中…';bar.style.width='88%';
  assist.dataset.rarity=rarity;assist.dataset.setinfo=setinfo;
  document.getElementById('fixName').value=name==='要確認'?'':name;
  assist.style.display='block';
  bar.style.width='100%';st.textContent=name==='要確認'?'カード名だけ確認してください':'候補を作成しました';
  tx.innerHTML='名前：<b>'+esc(name)+'</b><br>レアリティ：<b>'+esc(rarity)+'</b><br>右下の収録情報：<b>'+esc(setinfo)+'</b><br><small>※自信のない文字は検索条件から外します。</small>';
  showCandidate(name,rarity,setinfo,nameTexts.join('\n')+'\n'+rarityText+'\n'+setText);
 }catch(e){
  st.textContent='判定に失敗しました';tx.textContent='カードを正面から、四隅まで入れて撮り直してください。';assist.style.display='block';
 }
 finally{btn.disabled=false;btn.textContent='カード候補を絞り込む'}
}</script></body></html>
